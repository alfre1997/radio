<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Libertador FM</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .player-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 40px 24px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .play-btn {
            background: #2563eb;
            border: none;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s, background-color 0.2s;
            outline: none;
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .play-btn svg {
            width: 36px;
            height: 36px;
            fill: #ffffff;
        }

        .volume-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 10px;
        }

        .volume-container svg {
            width: 20px;
            height: 20px;
            fill: #94a3b8;
        }

        .volume-slider {
            width: 100%;
            accent-color: #2563eb;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="live-badge">
            <span class="dot"></span> EN VIVO
        </div>

        <button class="play-btn" id="playBtn" aria-label="Reproducir">
            <!-- Ícono Play por defecto -->
            <svg id="playIcon" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <!-- Ícono Pause oculto por defecto -->
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
        </button>

        <div class="volume-container">
            <svg viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
            </svg>
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>

        <audio id="radioAudio" preload="none">
            <source src="https://stream.radiosenpy.net/8066/stream" type="audio/mpeg">
            <source src="https://stream.radiosenpy.net/8066/;" type="audio/mpeg">
        </audio>
    </div>

    <script>
        const audio = document.getElementById('radioAudio');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const volumeSlider = document.getElementById('volumeSlider');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => {
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                }).catch(err => {
                    console.error("Error al reproducir audio:", err);
                });
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });
    </script>

</body>
</html>
